services:
  api:
    build:
      target: development
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./nodemon.json:/app/nodemon.json
      - /app/node_modules
      - /app/dist
    command: sh -c "npx prisma db push && npx prisma generate && npm run dev"
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public"
