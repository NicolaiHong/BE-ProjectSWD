services:
  api:
    build:
      target: production
    restart: always
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
    volumes: [] # No code mount in production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
